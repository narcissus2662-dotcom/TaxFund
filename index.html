<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>กองทุนลดหย่อนภาษี</title>
<meta name="theme-color" content="#3B4CF0" />
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;600;800&display=swap" rel="stylesheet" />
<style>
  /* หน้าแจ้งย้าย: แอปตัวจริงอยู่บน Google Apps Script แล้ว หน้านี้ไม่อ่านหรือเขียนข้อมูลใด ๆ */
  :root{ --ink:#16130F; --cobalt:#3B4CF0; --cream:#FBF4E9; --muted:#6E6552; }
  *{box-sizing:border-box;}
  html,body{margin:0; background:var(--cream);}
  body{font-family:'Kanit', -apple-system, BlinkMacSystemFont, sans-serif; color:var(--ink);}
  main{max-width:440px; margin:0 auto; padding:calc(48px + env(safe-area-inset-top)) 16px 40px;}
  .eyebrow{font-size:12px; font-weight:600; letter-spacing:.06em; color:#B5321F; margin-bottom:4px;}
  h1{font-size:30px; font-weight:800; line-height:1.15; margin:0 0 12px;}
  p{font-size:16px; line-height:1.55; margin:0 0 24px;}
  .go{display:block; text-align:center; background:var(--cobalt); color:#fff; text-decoration:none; font-size:18px; font-weight:600; padding:16px; border-radius:14px;}
  .go:active{background:var(--ink);}
  .note{font-size:13px; color:var(--muted); margin-top:16px;}
</style>
</head>
<body>
<main>
  <div class="eyebrow">กองทุนลดหย่อนภาษี</div>
  <h1>แอปย้ายไปเก็บข้อมูลใน Google Sheet แล้ว</h1>
  <p>ทุกรายการที่บันทึกจะเก็บไว้ใน Google Sheet ล้างข้อมูลในเบราว์เซอร์แล้วข้อมูลไม่หาย</p>
  <a class="go" href="https://script.google.com/macros/s/AKfycbyS561opFDcuNMO3Qtik7FPrpuAmvUAcCP1_vsyVHC-pioMxuPMJnUoF5BkiEy958fk/exec">เปิดแอปใหม่</a>
  <p class="note">ไอคอนเดิมบนหน้าจอโฮมลบทิ้งได้ แล้วเพิ่มไอคอนใหม่จากหน้าแอปใหม่แทน</p>
</main>
</body>
</html>
